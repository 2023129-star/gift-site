kind = "web"
previewPath = "/"
title = "Saglash's Birthday Gift"
version = "1.0.0"
id = "artifacts/saglash-birthday"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18150

[services.development]
run = "pnpm --filter @workspace/saglash-birthday run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/saglash-birthday", "run", "build" ]
publicDir = "artifacts/saglash-birthday/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18150"
BASE_PATH = "/"
